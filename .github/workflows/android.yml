name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 웹 자산 동기화
        run: |
          npm ci
          npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 버전 확인
        id: ver
        run: |
          V=$(sed -n 's/.*APP_VERSION = "\(.*\)".*/\1/p' www/version.js)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "used-price-v$V.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "used-price.apk"

      - name: 릴리스에 올리기 (주소 고정)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.version }}
          gh release view test >/dev/null 2>&1 || gh release create test --title "테스트 빌드" --notes "자동 빌드" --prerelease
          gh release upload test "used-price-v$V.apk" used-price.apk --clobber
          gh release edit test --notes "버전 v$V · 커밋 ${GITHUB_SHA::7} · $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') (한국시간) · $(git log -1 --pretty=%s)"

      - uses: actions/upload-artifact@v4
        with:
          name: used-price-v${{ steps.ver.outputs.version }}
          path: used-price-v${{ steps.ver.outputs.version }}.apk
